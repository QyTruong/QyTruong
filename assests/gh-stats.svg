          <radialGradient id="auStatsSun">
            <stop offset="0%" stop-color="#FFF0B0" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#FFD27A" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#FFD27A" stop-opacity="0"/>
          </radialGradient>
        </defs>
  
        <rect width="800" height="300" fill="url(#auStatsSky)"/>
  
