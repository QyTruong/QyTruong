
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="800"
        height="300"
        viewBox="0 0 800 300"
      >
        <style>
      @keyframes auStatsReveal {
        0%, 10% {
          opacity: 0;
          transform: translateY(8px);
        }
  
        22%, 82% {
          opacity: 1;
          transform: translateY(0);
        }
  
        95%, 100% {
          opacity: 0;
          transform: translateY(-5px);
        }
      }
  
      @keyframes auStatsLeaf {
        0% {
          transform: translateY(-30px) rotate(0deg);
          opacity: 0;
        }
  
        15% {
          opacity: 0.8;
        }
  
        55% {
          transform: translateY(135px) translateX(24px) rotate(180deg);
        }
  
        100% {
          transform: translateY(330px) translateX(-25px) rotate(360deg);
          opacity: 0;
        }
      }
  
      @keyframes auStatsSun {
        0%, 100% {
          opacity: 0.42;
        }
  
        50% {
          opacity: 0.7;
        }
      }
  
      .au-stats-sun {
        animation:
          auStatsSun
          15s
          ease-in-out
          infinite;
      }
  
      .au-stats-leaf {
        animation:
          auStatsLeaf
          19s
          linear
          infinite;
      }
  
      
        .au-stats-title,
        .au-stats-handle,
        .au-stat-card,
        .au-stats-language,
        .au-stats-legend,
        .au-stats-total {
          animation:
            auStatsReveal
            15s
            ease-out
            infinite;
        }
  
        .au-stat-card-0 {
            animation-delay: 1.20s;
          }
.au-stat-card-1 {
            animation-delay: 1.80s;
          }
.au-stat-card-2 {
            animation-delay: 2.40s;
          }
.au-stat-card-3 {
            animation-delay: 3.00s;
          }
  
        .au-stats-language {
          animation-delay: 4.20s;
        }
  
        .au-stats-legend {
          animation-delay: 4.80s;
        }
  
        .au-stats-total {
          animation-delay: 5.70s;
        }
      
    </style>
  
        <defs>
          <linearGradient id="auStatsSky" x1="0" y1="0" x2="0" y2="1">
