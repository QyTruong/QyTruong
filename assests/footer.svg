
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="800"
        height="200"
        viewBox="0 0 800 200"
      >
        <style>
      @keyframes auFooterLeaf {
        0% {
          transform: translateY(-45px) translateX(0) rotate(0deg);
          opacity: 0;
        }
  
        15% {
          opacity: 0.9;
        }
  
        50% {
          transform: translateY(85px) translateX(20px) rotate(170deg);
        }
  
        85% {
          opacity: 0.75;
        }
  
        100% {
          transform: translateY(230px) translateX(-28px) rotate(350deg);
          opacity: 0;
        }
      }
  
      @keyframes auFooterReveal {
        0%, 12% {
          opacity: 0;
          transform: translateY(8px);
        }
  
        25%, 82% {
          opacity: 1;
          transform: translateY(0);
        }
  
        95%, 100% {
          opacity: 0;
          transform: translateY(-5px);
        }
      }
  
      @keyframes auFooterGlow {
        0%, 100% {
          opacity: 0.4;
        }
  
        50% {
          opacity: 0.72;
        }
      }
  
      .au-footer-leaf {
        animation:
          auFooterLeaf
          20s
          linear
          infinite;
      }
  
      .au-footer-sun {
        animation:
          auFooterGlow
          15s
          ease-in-out
          infinite;
      }
  
      
        .au-footer-divider,
        .au-footer-eyebrow,
        .au-footer-name,
        .au-footer-socials,
        .au-footer-credit {
          animation:
            auFooterReveal
            15s
            ease-out
            infinite;
        }
  
        .au-footer-name {
          animation-delay: 1.20s;
        }
  
        .au-footer-socials {
          animation-delay: 2.40s;
        }
  
        .au-footer-credit {
          animation-delay: 3.60s;
        }
      
    </style>
  
        <defs>
          <linearGradient id="auFooterSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#BFE3F2"/>
            <stop offset="60%" stop-color="#F4D9BB"/>
            <stop offset="100%" stop-color="#F2B17F"/>
          </linearGradient>
  
          <radialGradient id="auFooterSun">
            <stop offset="0%" stop-color="#FFF0B0" stop-opacity="0.95"/>
            <stop offset="45%" stop-color="#FFD27A" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#FFD27A" stop-opacity="0"/>
          </radialGradient>
        </defs>
  
        <rect width="800" height="200" fill="url(#auFooterSky)"/>
  
        <!-- warm sun -->
        <circle
          class="au-footer-sun"
          cx="400"
          cy="18"
          r="105"
          fill="url(#auFooterSun)"
